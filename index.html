button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 18px}

/* логотип */
.brand{text-align:center;padding:30px 0 22px}
.logo{width:min(210px,58vw);height:auto;display:block;margin:0 auto;filter:drop-shadow(0 10px 24px rgba(0,0,0,.45));animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.hero{display:flex;align-items:center;gap:16px;padding:26px 0 20px}
.avatar:not([hidden]) + .emb{display:none}
.emb{width:54px;height:auto;flex:none;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
.hero h1{font-family:var(--serif);font-weight:500;font-size:32px;line-height:1.05;color:var(--gold)}
.hero p{color:var(--muted);font-size:13px;margin-top:4px}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--line-strong),transparent);margin:0 0 18px}

/* фильтры */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 16px;scrollbar-width:none;justify-content:safe center}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 15px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:14px;background:rgba(2,26,22,.4)}
.chip[aria-pressed=true]{border-color:var(--gold);color:var(--gold)}

/* афиша: карточки как пригласительные */
#games{display:grid;gap:12px}
.game{position:relative;display:grid;grid-template-columns:62px 1fr;gap:16px;width:100%;text-align:left;padding:18px 18px 16px;
  background:var(--surface);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(6px)}
.game::after{content:"";position:absolute;inset:4px;border:1px solid rgba(216,204,178,.08);border-radius:12px;pointer-events:none}
.game:active{border-color:var(--line-strong)}
.day{text-align:center;border-right:1px solid var(--line);padding-right:14px}
.day b{display:block;font-family:var(--serif);font-weight:500;font-size:42px;line-height:.95;color:var(--gold)}
.day span{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.g-title{font-family:var(--serif);font-weight:600;font-size:21px;line-height:1.15;color:var(--ivory)}
.g-meta{color:var(--muted);font-size:13.5px;margin-top:4px}
.g-row{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;font-size:14px}
.seats{color:var(--gold-dim)}
.seats.out{color:var(--danger)}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}
.empty strong{display:block;font-family:var(--serif);font-size:24px;color:var(--gold);font-weight:500;margin-bottom:6px}

/* профиль */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;position:relative;backdrop-filter:blur(6px)}
.card::after{content:"";position:absolute;inset:4px;border:1px solid rgba(216,204,178,.08);border-radius:14px;pointer-events:none}
.balance{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.balance b{font-family:var(--serif);font-weight:500;font-size:54px;line-height:.9;color:var(--gold)}
.balance small{display:block;color:var(--muted);font-size:13px;margin-top:6px}
.balance .side{text-align:right;color:var(--muted);font-size:13px}
.balance .side em{display:block;font-style:normal;color:var(--ivory);font-size:22px;font-family:var(--serif)}
h2{font-family:var(--serif);font-weight:500;font-size:24px;color:var(--gold);margin:30px 0 6px}
.item{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.item .t{font-size:15px}
.item .s{color:var(--muted);font-size:13px;margin-top:2px}
.pill{flex:none;align-self:flex-start;font-size:12.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.ok{border-color:#2F7D66;color:#A8D9C7}
.pill.wait{border-color:var(--gold-dim);color:var(--gold)}
.pill.no{border-color:rgba(217,137,122,.5);color:var(--danger)}
.link{color:var(--gold);font-size:13px;margin-top:6px;text-decoration:underline;text-underline-offset:3px}
.plus{color:#A8D9C7}.minus{color:var(--danger)}
.note{font-size:13px;color:var(--muted);margin-top:6px}

/* навигация */
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(2,26,22,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:10px 18px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px;z-index:5}
nav button{flex:1;max-width:200px;padding:11px 6px;border-radius:12px;color:var(--muted);font-size:15px;letter-spacing:.02em;white-space:nowrap}
nav button[aria-current=page]{background:var(--surface-2);color:var(--gold);box-shadow:inset 0 0 0 1px var(--line)}

/* шторка брони */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:90vh;overflow-y:auto;background:#06261F;border-radius:22px 22px 0 0;border-top:1px solid var(--line-strong);
  padding:10px 0 calc(24px + env(safe-area-inset-bottom));transform:translateY(102%);transition:transform .32s cubic-bezier(.2,.8,.2,1);z-index:11}
.open .scrim{opacity:1;pointer-events:auto}.open .sheet{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line-strong);margin:0 auto 16px}
.sheet h3{font-family:var(--serif);font-weight:600;font-size:28px;line-height:1.1;color:var(--gold)}
.sheet .meta{color:var(--muted);margin-top:6px;font-size:14px}
.sheet .desc{margin-top:14px;font-size:14.5px;color:#D3CCBE;white-space:pre-line}
.field{margin-top:22px}
.field > label,.field > .lbl{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}
.stepper{display:flex;align-items:center;gap:18px}
.stepper button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line-strong);font-size:22px;color:var(--gold)}
.stepper button:disabled{opacity:.3}
.stepper output{font-family:var(--serif);font-size:30px;min-width:24px;text-align:center}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;padding:9px;border-radius:9px;color:var(--muted)}
.seg-4{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.seg button[aria-pressed=true]{background:var(--surface-2);color:var(--gold)}
input[type=range]{width:100%;accent-color:var(--gold)}
textarea{width:100%;min-height:64px;background:rgba(2,26,22,.7);border:1px solid var(--line);border-radius:12px;color:var(--ivory);padding:10px 12px;font:inherit;resize:vertical}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:24px;padding-top:16px;border-top:1px solid var(--line)}
.total b{font-family:var(--serif);font-size:30px;font-weight:500;color:var(--gold)}
.cta{display:block;width:100%;margin-top:18px;padding:15px;border-radius:14px;background:linear-gradient(180deg,#E6DCC4,#C9BC9E);color:#0B2A23;font-weight:700;font-size:16px;letter-spacing:.02em}
.cta:disabled{opacity:.45}
.cta.ghost{background:none;border:1px solid var(--line-strong);color:var(--ivory);font-weight:400}
.done{text-align:center;padding:22px 0 6px}
.req{margin-top:16px;padding:14px 16px;border:1px dashed var(--line-strong);border-radius:14px;text-align:left;white-space:pre-line;font-size:14.5px;color:var(--ivory);user-select:text;-webkit-user-select:text}
.req small{display:block;color:var(--muted);font-size:12.5px;margin-bottom:4px}
.copy{display:block;width:100%;text-align:left;margin:2px 0;padding:6px 0;color:var(--gold);word-break:break-all;font-size:14px}
.copy span{display:block;font-size:11.5px;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.avatar{width:54px;height:54px;border-radius:50%;object-fit:cover;flex:none;border:1px solid var(--line-strong)}
.who{display:flex;align-items:center;gap:14px;margin:18px 0 4px}
.who b{display:block;font-family:var(--serif);font-size:22px;font-weight:500;color:var(--ivory)}
.who span{color:var(--muted);font-size:13px}
.inp{width:100%;background:rgba(2,26,22,.7);border:1px solid var(--line);border-radius:12px;color:var(--ivory);padding:12px 14px;font:inherit;font-size:16px;color-scheme:dark}
.inp:focus{border-color:var(--gold-dim);outline:none}
.inline-link{display:inline-block;margin-top:8px;color:var(--gold);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.plist{display:flex;flex-wrap:wrap;gap:8px}
.pchip{display:flex;align-items:center;gap:7px;padding:4px 11px 4px 4px;border:1px solid var(--line);border-radius:999px;font-size:13.5px;background:rgba(2,26,22,.5)}
.pchip.wait{border-style:dashed}
.pav{width:26px;height:26px;border-radius:50%;object-fit:cover;flex:none;background:var(--surface-2);color:var(--gold);font-size:12px;display:flex;align-items:center;justify-content:center}
.pchip em{font-style:normal;color:var(--muted);font-size:12px}
.maplink{color:var(--gold);text-decoration:underline;text-underline-offset:3px;text-align:left;font-size:14px;padding:2px 0;line-height:1.4}
.gold{color:var(--gold);font-family:var(--serif);font-weight:500;font-size:20px}
.muted{color:var(--muted);font-style:normal;font-size:12.5px}
.bar{height:6px;border-radius:3px;background:rgba(216,204,178,.12);margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#1A6C5E,#ECDBBE)}
.lv{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:6px}
.qa{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.qa button{border:1px solid var(--line);border-radius:12px;padding:10px 6px;font-size:13px;color:var(--ivory);background:rgba(2,26,22,.5)}
.gift{margin-top:12px;padding:10px 14px;border:1px dashed var(--gold-dim);border-radius:12px;color:var(--gold);font-size:14px}
.rank{align-items:center}.rank.me .t{color:var(--gold)}
.place{width:22px;text-align:right;color:var(--muted);font-size:13px;margin-right:2px}
.agu{align-items:center;flex-wrap:wrap}.agu .who{flex:1 1 60%;min-width:0}.acts{display:flex;gap:6px;flex:0 0 auto;margin-left:auto}.agu .acts:has(.ok){flex-basis:100%;justify-content:flex-end;margin-top:4px}
.mini{border:1px solid var(--line-strong);border-radius:10px;padding:6px 10px;font-size:13px;color:var(--ivory);font-family:var(--sans)}
.mini.ok{border-color:#2F7D66;color:#A8D9C7}.mini.gold{color:var(--gold);border-color:var(--gold-dim)}.mini:disabled{opacity:.4}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gbtn{display:flex;justify-content:space-between;align-items:center;gap:6px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px;text-align:left;color:var(--ivory);background:rgba(2,26,22,.5);transition:background .3s}
.gbtn b{font-family:var(--serif);font-weight:500;font-size:17px}
.gbtn.earn b{color:#A8D9C7}.gbtn.spend b{color:var(--gold)}.gbtn:disabled{opacity:.4}
.done-flash{background:rgba(47,125,102,.45)}
.check-ok{color:#A8D9C7;font-size:13px;margin-top:6px}
.done .emb{width:70px;margin:0 auto 14px;display:block}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;background:var(--surface-2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;transition:.25s;z-index:20;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.skel{height:104px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(90deg,transparent,rgba(216,204,178,.06),transparent) 0 0/200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<div id="sheet-root"><div class="scrim" id="scrim"></div><section class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div class="wrap" id="sheet-body"></div></section></div>

<input type="file" id="file" accept="image/*,application/pdf" hidden>

<script>
const API = 'https://script.google.com/macros/s/AKfycbyQcYZznGgb7SjKDjIz4qF5_agTgUKfLoIqB6QOiYpZQJ285NA19b3bafoTVzp_I_w/exec';
const TZ = 'Asia/Makassar';
const tg = window.Telegram && Telegram.WebApp;
const state = { games: [], profile: null, filter: 'Все' };

if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#04201B'); tg.setBackgroundColor('#04201B'); } catch (e) {} }
const haptic = t => { try { tg.HapticFeedback.notificationOccurred(t); } catch (e) {} };
const tap = () => { try { tg.HapticFeedback.selectionChanged(); } catch (e) {} };

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = n => String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const plural = (n, a, b, c) => { n = Math.abs(n) % 100; const d = n % 10; return n > 10 && n < 20 ? c : d > 1 && d < 5 ? b : d === 1 ? a : c; };
const amount = (n, c) => c === 'RUB' ? money(n) + ' ₽' : money(n) + ' ' + c;
const PAYS = [['IDR перевод', 'Перевод IDR'], ['IDR наличные', 'Наличные IDR'], ['USDT', 'USDT'], ['RUB', 'Рубли']];
const curOf = p => p.indexOf('IDR') === 0 ? 'IDR' : p;
const fmt = (ts, o) => new Intl.DateTimeFormat('ru-RU', Object.assign({ timeZone: TZ }, o)).format(new Date(ts));

function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 3200); }

async function api(action, data) {
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 25000);
  let res;
  try {
    res = await fetch(API, { method: 'POST', signal: ctl.signal,
      body: JSON.stringify(Object.assign({ action, initData: tg ? tg.initData : '' }, data || {})) });
  } catch (e) { throw new Error('Нет связи с сервером. Проверьте интернет и попробуйте ещё раз'); }
  finally { clearTimeout(timer); }
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'Не удалось выполнить запрос');
  return j;
}

/* ---------- афиша ---------- */
async function loadGames() {
  try { const r = await api('games'); state.games = r.games; state.requisites = r.requisites || {}; state.waits = r.waits || []; renderGames(); }
  catch (e) { $('games').innerHTML = '<div class="empty"><strong>Афиша не загрузилась</strong>' + esc(e.message) + '</div>'; }
}

function renderGames() {
  const formats = ['Все', ...new Set(state.games.map(g => g.format).filter(Boolean))];
  if (formats.indexOf(state.filter) < 0) state.filter = 'Все';
  $('chips').innerHTML = formats.length > 2 ? formats.map(f => '<button class="chip" aria-pressed="' + (f === state.filter) + '" data-f="' + esc(f) + '">' + esc(f) + '</button>').join('') : '';
  const list = state.games.filter(g => state.filter === 'Все' || g.format === state.filter);
  if (!list.length) { $('games').innerHTML = '<div class="empty"><strong>Скоро новые игры</strong>Расписание появится здесь, а бот напишет, когда откроется запись.</div>'; return; }
  $('games').innerHTML = list.map(g => {
    const seats = g.invite ? 'По приглашению' : g.open ? 'Осталось ' + g.left + ' ' + plural(g.left, 'место', 'места', 'мест') : (state.waits || []).indexOf(g.id) >= 0 ? 'Вы в листе ожидания' : 'Мест нет';
    return '<button class="game" data-id="' + esc(g.id) + '">' +
      '<div class="day"><b>' + fmt(g.ts, { day: 'numeric' }) + '</b><span>' + fmt(g.ts, { month: 'short' }).replace('.', '') + '<br>' + fmt(g.ts, { weekday: 'short' }) + '</span></div>' +
      '<div><div class="g-title">' + esc(g.title) + '</div>' +
      '<div class="g-meta">' + esc(g.format) + ', ' + esc(g.time) + (g.place ? ', ' + esc(g.place) : '') + '</div>' +
      '<div class="g-row"><span class="seats' + (g.open || g.invite ? '' : ' out') + '">' + seats + '</span><span>' + (g.invite ? '' : g.tiers ? 'от ' + amount(Math.min.apply(null, g.tiers.map(t => t.IDR).filter(Boolean)), 'IDR') : g.prices && g.prices.IDR.f ? 'от ' + amount(Math.min(g.prices.IDR.f, g.prices.IDR.m || g.prices.IDR.f), 'IDR') : '') + '</span></div></div></button>';
  }).join('');
}

$('chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; tap(); state.filter = b.dataset.f; renderGames(); });
$('games').addEventListener('click', e => { const b = e.target.closest('.game'); if (b) openBooking(state.games.find(g => g.id === b.dataset.id)); });

/* ---------- бронь ---------- */
function openBooking(g) {
  if (!g) return;
  if (state.profile && !state.profile.registered) return showRegistration();
  const p = state.profile || { balance: 0, pointRate: 0, gender: '' };
  const f = { girls: p.gender === 'Девушка' ? 1 : 0, guys: p.gender === 'Парень' ? 1 : 0, pay: 'IDR перевод', points: 0, comment: '' };
  const tiers = g.tiers;
  if (tiers) tiers.forEach((t, i) => { f['t' + i] = i === 0 ? 1 : 0; });
  const pays = tiers ? PAYS.filter(m => tiers.some(t => t[curOf(m[0])] > 0)) : PAYS;
  let players = null, active = true;
  api('players', { gameId: g.id }).then(r => { players = r.players; if (active) draw(); }).catch(() => { players = []; if (active) draw(); });
  const maxSeats = Math.min(g.left, 8);
  const pr = g.prices || { IDR: { f: 0, m: 0 }, USDT: { f: 0, m: 0 }, RUB: { f: 0, m: 0 } };

  const stepper = (key, label, price) =>
    '<div class="field"><span class="lbl">' + label + (price ? ', ' + amount(price, curOf(f.pay)) : '') + '</span><div class="stepper">' +
    '<button data-act="minus" data-k="' + key + '" aria-label="Меньше" ' + (f[key] <= 0 ? 'disabled' : '') + '>−</button><output>' + f[key] + '</output>' +

  const count = () => tiers ? tiers.reduce((s, t, i) => s + f['t' + i], 0) : f.girls + f.guys;

    $('sheet-body').innerHTML =
      '<h3>Оплата</h3>' +

function readReceipt(file) {
  return new Promise((resolve, reject) => {
    if (file.type === 'application/pdf') {
      if (file.size > 6 * 1024 * 1024) return reject(new Error('PDF больше 6 МБ'));
      const fr = new FileReader();
      fr.onload = () => resolve({ data: String(fr.result).split(',')[1], mime: 'application/pdf' });
      fr.onerror = () => reject(new Error('Не удалось прочитать файл'));
      return fr.readAsDataURL(file);
    }
    if (!/^image\//.test(file.type)) return reject(new Error('Нужно фото или PDF'));
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve({ data: c.toDataURL('image/jpeg', 0.85).split(',')[1], mime: 'image/jpeg' });
    };
    img.onerror = () => reject(new Error('Не удалось открыть фото'));
    img.src = url;
  });
}

  const draw = () => {
    target.innerHTML =
      '<div class="who">' + (photo ? '<img class="avatar" alt="" src="' + esc(photo) + '">' : '') +
      '<div><b>' + esc(v.name || 'Гость') + '</b><span>' + esc(p.username || (u.username ? '@' + u.username : '')) + '</span></div></div>' +
      '<div class="field"><label for="f-name">Имя</label><input class="inp" id="f-name" maxlength="60" autocomplete="name" value="' + esc(v.name) + '"></div>' +
      '<div class="field"><label for="f-nick">Игровой ник</label><input class="inp" id="f-nick" maxlength="30" placeholder="Как вас называть за столом" value="' + esc(v.nick) + '"></div>' +
      '<div class="field"><span class="lbl">Пол</span><div class="seg">' + ['Девушка', 'Парень'].map(x =>
        '<button type="button" data-g="' + x + '" aria-pressed="' + (v.gender === x) + '">' + x + '</button>').join('') + '</div></div>' +
      '<div class="field"><label for="f-phone">Телефон / WhatsApp</label><input class="inp" id="f-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+62 812 3456 7890" value="' + esc(v.phone) + '">' +
      (tg && tg.requestContact ? '<button type="button" class="inline-link" data-act="contact">Взять номер из Telegram</button>' : '') + '</div>' +
      '<div class="field"><label for="f-birth">Дата рождения</label><input class="inp" id="f-birth" type="date" value="' + esc(v.birth) + '"></div>' +
      '<button class="cta" data-act="save">' + (editing ? 'Сохранить' : 'Сохранить и войти') + '</button>' +
      (editing ? '<button class="cta ghost" data-act="close">Отмена</button>' : '');
  };
  const read = () => ['name', 'nick', 'phone', 'birth'].forEach(k => { const el = $('f-' + k); if (el) v[k] = el.value.trim(); });
  target.onclick = async e => {
    const b = e.target.closest('button'); if (!b) return;
    read();
    if (b.dataset.g) { tap(); v.gender = b.dataset.g; draw(); return; }
    if (b.dataset.act === 'close') return closeSheet();
    if (b.dataset.act === 'contact') {
      tg.requestContact((ok, res) => {
        const ph = ok && res && res.responseUnsafe && res.responseUnsafe.contact && res.responseUnsafe.contact.phone_number;
        if (ph) { v.phone = (ph.charAt(0) === '+' ? '' : '+') + ph; draw(); }
      });
      return;
    }
    if (b.dataset.act === 'save') {
      b.disabled = true; b.textContent = 'Сохраняем…';
      try { await api('register', v); haptic('success'); await loadProfile(); onSaved(); }
      catch (err) { haptic('error'); toast(err.message); b.disabled = false; b.textContent = editing ? 'Сохранить' : 'Сохранить и войти'; }
    }
  };
  draw();
}

function showRegistration() {
  $('reg-logo').src = document.querySelector('.logo').src;
  ['view-games', 'view-profile'].forEach(id => $(id).hidden = true);
  $('view-register').hidden = false;
  document.querySelector('nav').hidden = true;
  regForm(state.profile, $('reg-form'), () => {
    $('view-register').hidden = true; document.querySelector('nav').hidden = false;
    show('games'); toast('Профиль сохранён');
  });
}

function editProfile() {
  regForm(state.profile, $('sheet-body'), () => { closeSheet(); toast('Профиль обновлён'); }, true);
  document.body.classList.add('open');
  if (tg && tg.BackButton) { tg.BackButton.show(); tg.BackButton.onClick(closeSheet); }
}

/* ---------- грани: рейтинг, сокровищница, поделиться ---------- */
function sheetOpen(html, onclick) {
  $('sheet-body').innerHTML = html;
  $('sheet-body').onclick = onclick || (e => { if (e.target.closest('[data-act=close]')) closeSheet(); });
  $('sheet-body').oninput = null;
  document.body.classList.add('open'); $('sheet').scrollTop = 0;
  if (tg && tg.BackButton) { tg.BackButton.show(); tg.BackButton.onClick(closeSheet); }
}
const graniWord = n => plural(Math.abs(n), 'грань', 'грани', 'граней');

async function openRating() {
  sheetOpen('<h3>Корона сезона</h3><p class="meta">Загружаем рейтинг…</p>');
  try {
    const r = await api('rating');
    sheetOpen('<h3>Корона сезона</h3><p class="meta">Сезон ' + r.season + ' · до ' + esc(r.end) + '. 15 лучших по балансу выходят в закрытый турнир с большими призовыми.</p>' +
      (r.top.length ? r.top.map(x =>
        '<div class="item rank' + (x.me ? ' me' : '') + '"><div class="who" style="margin:0"><span class="place">' + x.place + '</span>' +
        (x.photo ? '<img class="pav" alt="" src="' + esc(x.photo) + '">' : '<span class="pav">' + esc(x.nick.charAt(0).toUpperCase()) + '</span>') +
        '<span class="t">' + esc(x.nick) + '</span></div><b class="gold">' + x.bal + '</b></div>').join('')
        : '<p class="note" style="margin-top:18px">В этом сезоне грани ещё никто не добыл. Первый вечер всё изменит.</p>') +
      (r.place > 15 ? '<p class="note" style="margin-top:14px">Ваше место: ' + r.place + ' из ' + r.total + '</p>' : '') +
      '<p class="note" style="margin-top:14px">Туда не попасть за деньги, только рейтинг. Потратил грани — сдвинулся в рейтинге.</p>' +
      '<button class="cta ghost" data-act="close">Закрыть</button>');
  } catch (e) { toast(e.message); closeSheet(); }
}

function openTreasury() {
  const p = state.profile, row = s => '<div class="item"><div class="t">' + esc(s.name) + '</div><b class="gold">' + s.cost + '</b></div>';
  sheetOpen('<h3>Сокровищница</h3><p class="meta">Что открывают грани. Привилегию заявите ведущему, и он спишет грани.</p>' +
    '<h2 style="margin-top:20px;font-size:20px">За столом</h2><p class="note">Только городская мафия, одна привилегия на партию, заявляется до раздачи.</p>' +
    p.spend.filter(s => s.table).map(row).join('') +
    '<h2 style="margin-top:20px;font-size:20px">Вне стола</h2><p class="note">В любом формате.</p>' +
    p.spend.filter(s => !s.table).map(row).join('') +
    '<p class="note" style="margin-top:14px">Детектив — территория чистого расследования. Здесь грани только добываются.</p>' +
    '<button class="cta ghost" data-act="close">Закрыть</button>');
}

function openTransfer() {
  const p = state.profile;
  sheetOpen('<h3>Поделиться гранями</h3><p class="meta">В сезоне у вас ' + p.balance + ' ' + graniWord(p.balance) + '. Переданные грани уходят из вашего рейтинга.</p>' +
    '<div class="field"><label for="tr-nick">Ник игрока</label><input class="inp" id="tr-nick" autocomplete="off" placeholder="Как в его профиле"></div>' +
    '<div class="field"><label for="tr-n">Сколько граней</label><input class="inp" id="tr-n" type="number" inputmode="numeric" min="1" max="' + p.balance + '"></div>' +
    '<button class="cta" data-act="send">Передать</button><button class="cta ghost" data-act="close">Отмена</button>',
    async e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.act === 'close') return closeSheet();
      if (b.dataset.act !== 'send') return;
      b.disabled = true;
      try {
        await api('transfer', { nick: $('tr-nick').value, amount: $('tr-n').value });
        haptic('success'); toast('Грани переданы'); closeSheet(); loadProfile();
      } catch (err) { haptic('error'); toast(err.message); b.disabled = false; }
    });
}

/* ---------- вкладка «Ведущий» ---------- */
const ADM = { tab: 'games', games: null, guests: null, q: '' };
const EARN_UI = [['win', 'Выиграл партию', 5], ['mvp', 'Игрок вечера', 25], ['dress', 'Дресс-код', 15], ['look', 'Образ вечера', 20],
  ['friend', 'Привёл друга', 40], ['story', 'Сторис', 5], ['suspect', 'Назвал преступника', 10], ['solved', 'Раскрыл дело первым', 20],
  ['costume', 'Костюм персонажа', 25], ['circle', 'Полный круг', 80], ['alone', 'Один против всех', 40], ['sheriff', 'Чистый шериф', 30]];
const SPEND_UI = [['word', 'Длинное слово', 15], ['amulet', 'Оберег', 40], ['vote', 'Вес голоса', 45], ['seat', 'Своё место', 60], ['first', 'Первый в списке', 70], ['choice', 'Право выбора', 80]];

async function loadAdmin() {
  $('admin').innerHTML = '<div class="skel"></div><div class="skel"></div>';
  try {
    const [g, u] = await Promise.all([api('admin_games'), api('admin_guests')]);
    ADM.games = g.games; ADM.guests = u.guests; renderAdmin();
  } catch (e) { $('admin').innerHTML = '<div class="empty"><strong>Не загрузилось</strong>' + esc(e.message) + '</div>'; }
}
function renderAdmin() {
  const tabs = '<div class="seg" style="margin:6px 0 16px"><button data-tab="games" aria-pressed="' + (ADM.tab === 'games') + '">Вечера</button><button data-tab="guests" aria-pressed="' + (ADM.tab === 'guests') + '">Все гости</button></div>';
  let body = '';
  if (ADM.tab === 'games') {
    body = ADM.games.length ? ADM.games.map(g => '<div class="card" style="margin-bottom:14px"><div class="g-title">' + esc(g.title) + '</div><div class="g-meta">' + esc(g.time) + ' · ' + esc(g.format) + ' · гостей: ' + g.guests.length + '</div>' +
      (g.guests.length ? g.guests.map(x => '<div class="item agu"><div class="who" style="margin:0">' +
        (x.photo ? '<img class="pav" alt="" src="' + esc(x.photo) + '">' : '<span class="pav">' + esc(x.nick.charAt(0).toUpperCase()) + '</span>') +
        '<div><div class="t">' + esc(x.nick) + (x.seats > 1 ? ' <em class="muted">+' + (x.seats - 1) + '</em>' : '') + '</div><div class="s">' + esc(x.status) + ' · ' + x.bal + ' ' + graniWord(x.bal) + '</div></div></div>' +
        '<div class="acts">' + (x.status === 'Подтверждена' ? '<button class="mini ok" data-mark="1" data-b="' + esc(x.booking) + '">Пришёл</button><button class="mini" data-mark="0" data-b="' + esc(x.booking) + '">Нет</button>' : '') +
        '<button class="mini gold" data-grant="' + esc(x.uid) + '" data-nick="' + esc(x.nick) + '" data-game="' + esc(g.time + ' ' + g.title) + '">Грани</button></div></div>').join('')
        : '<p class="note">Подтверждённых гостей пока нет.</p>') + '</div>').join('')
      : '<p class="note">В ближайшие дни игр нет.</p>';
  } else {
    const q = ADM.q.toLowerCase();
    const list = ADM.guests.filter(x => !q || (x.nick + ' ' + x.name).toLowerCase().indexOf(q) >= 0);
    body = '<input class="inp" id="adm-q" placeholder="Поиск по нику или имени" value="' + esc(ADM.q) + '" style="margin-bottom:8px">' +
      list.map(x => '<div class="item agu"><div class="who" style="margin:0">' +
        (x.photo ? '<img class="pav" alt="" src="' + esc(x.photo) + '">' : '<span class="pav">' + esc(x.nick.charAt(0).toUpperCase()) + '</span>') +
        '<div><div class="t">' + esc(x.nick) + '</div><div class="s">' + esc(x.name) + ' · ' + esc(x.level) + ' · ' + x.bal + '</div></div></div>' +
        '<div class="acts"><button class="mini gold" data-grant="' + esc(x.uid) + '" data-nick="' + esc(x.nick) + '" data-game="">Грани</button></div></div>').join('');
  }
  $('admin').innerHTML = tabs + body;
}
$('admin').addEventListener('input', e => {
  if (e.target.id !== 'adm-q') return;
  ADM.q = e.target.value; const pos = e.target.selectionStart; renderAdmin();
  const i = $('adm-q'); i.focus(); i.setSelectionRange(pos, pos);
});
$('admin').addEventListener('click', async e => {
  const t = e.target.closest('[data-tab]'); if (t) { ADM.tab = t.dataset.tab; tap(); return renderAdmin(); }
  const m = e.target.closest('[data-mark]');
  if (m) {
    m.disabled = true;
    try { await api('admin_mark', { bookingId: m.dataset.b, came: m.dataset.mark === '1' }); haptic('success'); toast(m.dataset.mark === '1' ? 'Отмечен, грани начислены' : 'Отмечен: не пришёл'); loadAdmin(); }
    catch (err) { haptic('error'); toast(err.message); m.disabled = false; }
    return;
  }
  const gr = e.target.closest('[data-grant]');
  if (gr) openGrant(gr.dataset.grant, gr.dataset.nick, gr.dataset.game);
});

function openGrant(uid, nick, game) {
  const btn = (k, n, v, cls) => '<button class="gbtn ' + cls + '" data-k="' + k + '"><span>' + esc(n) + '</span><b>' + (cls === 'spend' ? '−' : '+') + v + '</b></button>';
  sheetOpen('<h3>' + esc(nick) + '</h3><p class="meta">' + (game ? esc(game) : 'Вне вечера') + '</p>' +
    '<div class="field"><span class="lbl">Добыча</span><div class="grid2">' + EARN_UI.map(x => btn(x[0], x[1], x[2], 'earn')).join('') + '</div></div>' +
    '<div class="field"><span class="lbl">Сокровищница — списать</span><div class="grid2">' + SPEND_UI.map(x => btn(x[0], x[1], x[2], 'spend')).join('') + '</div></div>' +
    '<div class="field"><span class="lbl">Тайная грань (20–50) или корректировка (±)</span><div style="display:flex;gap:8px"><input class="inp" id="g-n" type="number" inputmode="numeric" placeholder="Число" style="flex:1"><input class="inp" id="g-note" placeholder="За что" style="flex:2"></div>' +
    '<div class="grid2" style="margin-top:8px"><button class="gbtn earn" data-k="secret"><span>Тайная грань</span></button><button class="gbtn" data-k="fix"><span>Корректировка</span></button></div></div>' +
    '<button class="cta ghost" data-act="close">Готово</button>',
    async e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.act === 'close') { closeSheet(); return loadAdmin(); }
      const k = b.dataset.k; if (!k) return;
      b.disabled = true;
      try {
        const r = await api('admin_grant', { uid, key: k, game, amount: $('g-n').value, note: $('g-note').value });
        haptic('success'); toast(nick + ': в сезоне ' + r.bal);
        b.classList.add('done-flash'); setTimeout(() => b.classList.remove('done-flash'), 700);
      } catch (err) { haptic('error'); toast(err.message); }
      b.disabled = false;
    });
}

/* ---------- навигация ---------- */
function show(view) {
  ['games', 'profile', 'admin'].forEach(v => {
    $('view-' + v).hidden = view !== v;
    if (view === v) $('nav-' + v).setAttribute('aria-current', 'page'); else $('nav-' + v).removeAttribute('aria-current');
  });
  if (view === 'admin') loadAdmin();
  tap(); window.scrollTo(0, 0);
}
$('nav-games').onclick = () => show('games');
$('nav-profile').onclick = () => show('profile');
$('nav-admin').onclick = () => show('admin');

if (!tg || !tg.initData) {
  $('games').innerHTML = '<div class="empty"><strong>Откройте через бота</strong>Приложение работает внутри Telegram: @the8mafiabali_bot</div>';
  $('profile').innerHTML = '';
} else {
  loadGames();
  loadProfile().then(() => { if (state.profile && !state.profile.registered) showRegistration(); });
}
</script>
